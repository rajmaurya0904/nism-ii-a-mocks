<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NISM II-A Mock Exams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: OMR answer-sheet. Question on the left, bubble grid (answer sheet) on the right; stacks on phones. */
:root{
  --bg:#f6f3f6; --surface:#ffffff; --sunk:#efe9ef; --ink:#251d28; --muted:#6d6372; --line:#e2d8e2;
  --plum:#5f2b55; --plum-2:#7d3d70; --plum-soft:#f1e5ee; --gold:#b98622; --gold-soft:#fbf1da;
  --good:#2c7a4d; --good-soft:#e4f3ea; --bad:#b03a2e; --bad-soft:#fbe8e5; --mark:#a8701a;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"Archivo",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151017; --surface:#1f1822; --sunk:#2a2130; --ink:#f0e9f1; --muted:#a79caa; --line:#372d3c;
  --plum:#d9a3cc; --plum-2:#c58bb8; --plum-soft:#33233a; --gold:#e3b65c; --gold-soft:#3a2e17;
  --good:#6cc590; --good-soft:#1c3326; --bad:#ef8b7f; --bad-soft:#3d1f1b; --mark:#e3b65c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151017; --surface:#1f1822; --sunk:#2a2130; --ink:#f0e9f1; --muted:#a79caa; --line:#372d3c;
  --plum:#d9a3cc; --plum-2:#c58bb8; --plum-soft:#33233a; --gold:#e3b65c; --gold-soft:#3a2e17;
  --good:#6cc590; --good-soft:#1c3326; --bad:#ef8b7f; --bad-soft:#3d1f1b; --mark:#e3b65c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--plum)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600}
.btn:hover{border-color:var(--plum-2)}
.btn.primary{background:var(--plum);border-color:var(--plum);color:var(--surface)}
.btn.primary:hover{background:var(--plum-2)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}

/* Home */
.masthead{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.masthead h1{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.masthead p{margin:8px 0 0;max-width:62ch;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.facts div{padding:10px 16px;border-right:1px solid var(--line);min-width:0}
.facts div:last-child{border-right:0}
.facts b{display:block;font-family:var(--f-mono);font-size:18px}
.facts span{font-size:12px;color:var(--muted)}
.overall{display:flex;flex-wrap:wrap;gap:24px;align-items:center;margin:18px 0 6px}
.overall .stat b{font-family:var(--f-mono);font-size:22px;display:block}
.overall .stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-top:18px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:128px}
.card:hover{border-color:var(--plum-2)}
.card .top{display:flex;justify-content:space-between;align-items:baseline}
.card .num{font-family:var(--f-mono);font-weight:700;font-size:22px;color:var(--plum)}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.pass{background:var(--good-soft);color:var(--good)}
.pill.fail{background:var(--bad-soft);color:var(--bad)}
.pill.prog{background:var(--gold-soft);color:var(--mark)}
.card .meta{font-size:13px;color:var(--muted);margin-top:auto}
.meter{height:6px;border-radius:3px;background:var(--sunk);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--plum-2);border-radius:3px}
.meter .pm{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--gold)}
.note{margin-top:22px;font-size:13px;color:var(--muted);max-width:80ch}

.jump{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 4px}
.jump a{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:14px}
.jump a b{font-family:var(--f-mono);color:var(--plum);margin-right:4px}
.jump a:hover{border-color:var(--plum-2)}
.jump .muted{font-size:13px;margin-left:auto}
.set{margin-top:34px;scroll-margin-top:16px}
.sethead{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:end;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sethead h2{font-size:24px;font-weight:800;letter-spacing:-.01em}
.sethead p{margin:4px 0 0;font-size:14px}
.setfacts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.setfacts b{color:var(--ink);font-size:15px}
.grid{margin-top:14px}
/* Intro */
.intro{max-width:760px;margin:24px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.intro h2{font-size:30px;font-weight:800}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.mode{border:1.5px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;background:var(--bg)}
.mode[aria-pressed="true"]{border-color:var(--plum);background:var(--plum-soft)}
.mode b{display:block;font-size:17px;margin-bottom:4px}
.mode span{font-size:13px;color:var(--muted)}
.mixtable{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.mixtable td{padding:4px 6px;border-bottom:1px solid var(--line)}
.mixtable td:last-child{text-align:right;font-family:var(--f-mono)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.history{font-size:13px;margin-top:14px}
.history li{margin:2px 0}

/* Exam */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bar .title{font-weight:800;font-family:var(--f-display)}
.timer{font-family:var(--f-mono);font-weight:700;font-size:20px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.bar .spacer{flex:1}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;margin-top:18px;align-items:start}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.qno{font-family:var(--f-mono);font-weight:700;color:var(--plum)}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--plum-soft);color:var(--plum);font-weight:600}
.qtext{font-size:19px;line-height:1.45;margin:14px 0 18px;font-weight:600;max-width:70ch}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--bg)}
.opt:hover{border-color:var(--plum-2)}
.opt .bub{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--muted)}
.opt.sel{border-color:var(--plum);background:var(--plum-soft)}
.opt.sel .bub{background:var(--plum);border-color:var(--plum);color:var(--surface)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .bub{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.explain{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--gold-soft);font-size:14px}
.explain b{color:var(--mark)}
.qnav{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.qnav .spacer{flex:1}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px)}
.sheet h3{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px}
.bubbles{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.bubbles button{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-family:var(--f-mono);font-size:10.5px;padding:0;max-width:100%;color:var(--muted)}
.bubbles button.ans{background:var(--plum);border-color:var(--plum);color:var(--surface)}
.bubbles button.mk{border-color:var(--mark);box-shadow:inset 0 0 0 2px var(--mark)}
.bubbles button.ans.mk{box-shadow:inset 0 0 0 2px var(--gold)}
.bubbles button.cur{outline:2px solid var(--gold);outline-offset:1px}
.bubbles button.ok{background:var(--good);border-color:var(--good);color:var(--surface)}
.bubbles button.no{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:5px;border:1.5px solid var(--line);background:var(--bg)}
.legend i.a{background:var(--plum);border-color:var(--plum)}
.legend i.m{border-color:var(--mark);box-shadow:inset 0 0 0 2px var(--mark)}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;text-align:center}
.counts div{background:var(--sunk);border-radius:8px;padding:6px}
.counts b{display:block;font-family:var(--f-mono);font-size:18px}
.counts span{font-size:11px;color:var(--muted)}

/* Overlay */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;z-index:20;padding:16px}
.dialog{background:var(--surface);border-radius:14px;padding:22px;max-width:420px;width:100%;border:1px solid var(--line)}
.dialog h3{font-size:20px;margin-bottom:8px}

/* Result */
.result-head{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:18px}
.score{font-family:var(--f-mono);font-weight:700;font-size:64px;line-height:1;color:var(--plum)}
.score small{font-size:22px;color:var(--muted)}
.verdict{font-size:13px;font-weight:800;letter-spacing:.06em;padding:4px 10px;border-radius:99px;display:inline-block}
.verdict.pass{background:var(--good-soft);color:var(--good)}
.verdict.fail{background:var(--bad-soft);color:var(--bad)}
.rstats{display:flex;flex-wrap:wrap;gap:22px;margin-top:10px}
.rstats b{font-family:var(--f-mono);font-size:20px;display:block}
.rstats span{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto;margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table.ch{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
table.ch th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line)}
table.ch td{padding:9px 14px;border-bottom:1px solid var(--line)}
table.ch td.n{font-family:var(--f-mono);text-align:right;white-space:nowrap}
table.ch tr:last-child td{border-bottom:0}
.hbar{height:8px;background:var(--sunk);border-radius:4px;position:relative;min-width:90px}
.hbar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 12px}
.filters button[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:var(--surface)}
.rv{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.rv.ok{border-left-color:var(--good)} .rv.no{border-left-color:var(--bad)} .rv.skip{border-left-color:var(--muted)}
.rv .q{font-weight:600;margin:6px 0 8px}
.rv .ans{font-size:14px;display:grid;gap:2px}
.rv .ans .y.bad{color:var(--bad)} .rv .ans .c{color:var(--good)}
.rv .e{font-size:13.5px;color:var(--muted);margin-top:6px}
@media (max-width:860px){
  .exam{grid-template-columns:minmax(0,1fr)}
  .sheet{position:static}
  .masthead{grid-template-columns:1fr}
  .result-head{grid-template-columns:1fr}
  .modes{grid-template-columns:1fr}
}
@media (max-width:560px){.bar .in{gap:8px;flex-wrap:nowrap}.bar .chip{display:none}.bar .btn{padding:7px 10px;font-size:14px}.timer{font-size:16px;padding:3px 7px}.bar .lg{display:none}}
@media (max-width:420px){.qtext{font-size:17px}.qcard{padding:16px}.bubbles{gap:4px}}
@media (prefers-reduced-motion:no-preference){.opt,.card,.btn{transition:border-color .15s,background-color .15s}}
</style>
</head>
<body>


<div id="app"></div>

<script>
const BANK=[];let _id=0;
function Q(ch,q,a,w,e){BANK.push({ch,q,a,w,e,id:_id++})}
function T(ch,q,v,e){BANK.push({ch,q:q+" State whether True or False.",a:v?"True":"False",w:[v?"False":"True"],e,id:_id++})}
// Ch 1
Q(1,"_______ capital is for perpetuity from the point of view of the company.","Equity",["Debt","Both debt and equity","None of the above"],"Equity cannot be taken out of the firm unless it is liquidated (or bought back). Debt always has a repayment date.");
Q(1,"Equity capital gives returns to investors in the form of:","Both dividend and capital appreciation",["Dividend only","Capital appreciation only","Fixed interest"],"Equity holders earn dividends declared by the company and gains from a rise in share price.");
Q(1,"The interest that a company will have to pay on the debt raised will depend upon its _______.","Default risk",["Market risk","Liquidity risk","Share price"],"The coupon depends on the risk of default of the issuer, which is why credit rating matters.");
T(1,"Debt capital is always raised for short-term periods.",false,"Debt may be short term (less than 1 year) or long term (more than 1 year, even 30 years or more).");
Q(1,"Which of the following is a hybrid security?","Preference shares",["Equity shares","Non-convertible debentures","Treasury bills"],"Preference shares have a fixed dividend like debt but are share capital. Convertible debentures are also hybrids.");
Q(1,"The liability of equity shareholders in a company is:","Limited to their contribution or any unpaid amount they agreed to pay",["Unlimited","Equal to the total debts of the company","Limited to the market value of their shares"],"Equity capital is issued with limited liability.");
Q(1,"Each equity share normally carries:","One vote",["Two votes","No voting right","Votes in proportion to the premium paid"],"Each equity share carries one vote; major decisions need resolutions passed by majority.");
Q(1,"A company has paid-up capital of Rs. 10 crore made of 1 crore shares of Rs. 10 each. An investor holding 10 lakh shares owns:","10 percent of the company",["1 percent of the company","5 percent of the company","20 percent of the company"],"10 lakh / 1 crore = 10 percent.");
Q(1,"Both debt and equity are reflected on which side of the balance sheet?","Liability side, as source of funds",["Asset side","Neither side","Debt on asset side, equity on liability side"],"Both are sources of funds and appear on the liability side.");
Q(1,"Funds brought in by promoters and owners of the business are called:","Equity capital",["Debt capital","Working capital","Loan capital"],"Owner contributions are equity capital; borrowed funds are debt capital.");
T(1,"Transactions in the secondary market change the capital structure of the company.",false,"Secondary market trades are between investors; the company's capital does not change.");
Q(1,"Convertible debentures are beneficial to a company mainly because:","There is no cash outflow on maturity",["They carry a very high coupon","They never dilute equity","They are always secured by government"],"On maturity the debt is converted into equity, so the company does not repay cash.");
Q(1,"Preference shares resemble debt instruments because they offer:","A pre-determined rate of dividend",["Voting rights on all matters","A right over the assets of the company","A fixed maturity period"],"They have a fixed dividend rate but no fixed maturity and no right over assets.");
Q(1,"Short-term debt is debt with a repayment period of:","Less than one year",["More than one year","Three to five years","More than 30 years"],"Short term = less than 1 year; long term = more than 1 year.");
Q(1,"A secured loan is one where:","Lenders have a right against the assets of the company on default",["No interest is payable","The loan is repaid in shares","SEBI guarantees repayment"],"Unsecured loans do not give such rights over assets.");
Q(1,"Equity shares are first issued by a company to the public through:","Initial Public Offer",["Secondary market trading","Buyback","Bonus issue"],"IPOs are made in the primary market; shares are then listed and traded in the secondary market.");
Q(1,"After meeting all expenses and provisions, the residual profit of a company belongs to:","Equity shareholders",["Debenture holders","Banks","Trade creditors"],"Equity holders are entitled to residual profits, usually distributed as dividend.");
Q(1,"Credit rating of a debt security is done by a:","SEBI registered Credit Rating Agency",["Stock exchange","Registrar and Transfer Agent","Depository"],"The coupon depends on default risk, so the rating by a SEBI registered CRA is important.");

// Ch 2
Q(2,"_____ rights give the equity investor a say in the management of the company.","Voting",["Dividend","Both voting and dividend","Transfer"],"Voting rights let shareholders vote for or against proposals.");
Q(2,"A 20 percent dividend declared on face value of Rs. 10 and market price of Rs. 120 translates into a dividend payout of:","Rs. 2.00",["Rs. 24.00","Rs. 20.00","Rs. 12.00"],"Dividend is computed on face value: 10 x 20/100 = Rs. 2.");
T(2,"Preference shareholders get preference over debenture holders in the payment of dividend.",false,"Preference shares get preference over equity shareholders. Debenture holders are creditors and rank above shareholders.");
Q(2,"Which of the following is/are examples of corporate actions?","All the options given",["Dividend","Bonus issue","Stock split"],"Dividend, bonus, split, consolidation, buyback and rights are all corporate actions.");
Q(2,"A company issues additional shares to existing shareholders without any capital contribution, based on their holding. This is a:","Bonus issue",["Rights issue","Preferential issue","Private placement"],"Bonus shares are issued out of accumulated profits, free of cost.");
Q(2,"The highest decision making authority in a corporate set-up is the:","General Body Meeting of shareholders",["Board of Directors","Managing Director","Company Secretary"],"The general meeting of shareholders (AGM) is the highest decision making body.");
Q(2,"An anti-dilution provision gives an investor the right to:","Maintain the same percentage ownership by buying a proportional amount of future issues",["Receive bonus shares every year","Block any new issue","Sell shares back to the company at par"],"It protects the investor's percentage holding when new securities are issued.");
Q(2,"The difference between the price expected by the seller and the price offered by the buyer is called:","Bid-ask spread",["Share premium","Dividend yield","Discount"],"A wide bid-ask spread indicates liquidity risk.");
Q(2,"In the event of liquidation, the claims of equity shareholders rank:","Last in order of preference",["First","Equal to secured lenders","Before trade creditors"],"Equity holders get refund of capital only after all other creditors are satisfied.");
Q(2,"The face value of a share:","Always remains fixed",["Changes daily with market price","Is decided daily by the stock exchange","Is always Rs. 100"],"Face value (par value) is fixed and is used to compute dividend.");
Q(2,"A company issues shares of face value Rs. 10 at Rs. 50 per share. The share premium per share is:","Rs. 40",["Rs. 50","Rs. 10","Rs. 60"],"Premium = issue price minus face value = 50 - 10.");
Q(2,"The maximum amount of equity capital a company can have is defined in its:","Memorandum of Association",["Articles of Association","Prospectus","Listing agreement"],"This maximum is the authorised capital, stated in the MoA.");
Q(2,"Which of the following is always true?","Paid-up capital is less than or equal to issued capital",["Paid-up capital is more than issued capital","Issued capital is more than authorised capital","Paid-up capital equals authorised capital"],"Paid-up <= Issued <= Authorised.");
Q(2,"Authorised capital Rs. 20 crore. Company issues Rs. 10 crore of Rs. 10 shares at par with Rs. 5 payable on application. Paid-up capital after allotment is:","Rs. 5 crore",["Rs. 10 crore","Rs. 20 crore","Rs. 2.5 crore"],"Only Rs. 5 of Rs. 10 is paid on 1 crore shares = Rs. 5 crore.");
Q(2,"If a holder of partly paid-up shares does not pay the call money as per schedule, the shares can be:","Forfeited, including the amount already paid",["Converted into debentures","Refunded at face value","Transferred to the RTA"],"The company can forfeit partly paid shares on non-payment of calls.");
Q(2,"Dividend declared by a company is computed as a percentage of:","Face value",["Market price","Book value of the company","Issue price"],"A 40 percent dividend on Rs. 10 face value = Rs. 4.");
Q(2,"To ensure clarity for investors, SEBI has mandated that listed companies declare dividend in terms of:","Rupees per share",["Percentage of face value","Percentage of market price","Percentage of net profit"],"Declaring in Rs. per share avoids confusion about face value.");
Q(2,"Dividend declared by a company during the year, before the final accounts, is called:","Interim dividend",["Final dividend","Cumulative dividend","Participating dividend"],"Final dividend is declared at year end; interim during the year.");

Q(15,"Which of the following is a rule for effective investor service communication?","All the options given",["Personalise the interaction","Avoid negative phrases","Listen closely and avoid interrupting"],"Also use consistent brand vocabulary and be clear and concise.");
Q(15,"The best time to ask a client for feedback is:","After the successful resolution of the problem",["Before listening to the problem","In the middle of the complaint","Never"],"Feedback improves service effectiveness.");
Q(15,"Before sharing knowledge with investors, RTA staff should know regulations such as:","All the options given",["SEBI (LODR)","SEBI (ICDR)","Companies Act, 2013"],"Also SEBI (Buy-back of Securities) Regulations.");

Q(15,"Lodgements where total value of securities exceeds a certain amount are:","Sorted separately and first verified by the Team Leader / Management Team",["Rejected","Processed last","Sent to SEBI"],"Extra care for high value cases.");

Q(15,"Documents can be shredded by the RTA only after:","Obtaining written approval from the client company",["30 days","SEBI's approval","Oral permission from the investor"],"An entry is made in the shredding/destruction register.");
Q(15,"Which of the following is a 'Don't' in client servicing?","Rejecting requests or allotments on flimsy grounds",["Using the FTR approach","Rendering fair and unbiased services","Collecting information for future communication"],"Also: no misrepresentation, no unfair competition, no discrimination.");
Q(15,"Which of the following is a 'Do' in client servicing?","Ensure inquiries are dealt with promptly using the First Time Right approach",["Divulge investor information to others","Discriminate among investors","Indulge in unfair competition"],"Also ensure timely transfers and benefits.");

Q(15,"Registered RTAs must disclose data on complaints received on their websites by the:","7th of the succeeding month",["Last day of the quarter","15th of every month","End of the financial year"],"In the prescribed format.");
Q(15,"An investor must first take up a grievance with:","The entity concerned",["SEBI SCORES","SMARTODR","The High Court"],"Then SCORES if not resolved in time.");
Q(15,"If the entity fails to redress a complaint within the specified timeline, the investor may file the complaint on:","SCORES",["The stock exchange trading terminal","The RBI portal","The MCA portal"],"SEBI Complaint Redress System.");
Q(15,"After exhausting all options, if still not satisfied, an investor may initiate online dispute resolution through:","SMARTODR portal",["SCORES only","The RTA's inward register","IEPF"],"For online conciliation and arbitration.");
Q(15,"The common Online Dispute Resolution portal has been established by:","Market Infrastructure Institutions",["SEBI's legal department","RTAs","Banks"],"Listed companies and intermediaries are enrolled on it.");
Q(15,"ODR institutions empanelled by MIIs provide the services of:","Qualified arbitrators and conciliators",["Stock brokers","Auditors","Depository participants"],"Conducted in online mode.");
T(15,"A market participant may also initiate dispute resolution through the ODR portal after giving due notice to the investor.",true,"For disputes not satisfactorily resolved between them.");
Q(15,"A party aggrieved by the decision of the appellate arbitrator may appeal to the:","High Court",["SCORES","The RTA","The stock exchange"],"After the appellate panel of arbitrators.");
Q(15,"SCORES 2.0, with auto-routing and auto-escalation, was introduced by SEBI in:","April 2024",["January 2022","July 2023","October 2025"],"Oversight by Designated Bodies.");
Q(15,"Investor grievances lodged on SCORES 2.0 or with the company/RTA must be redressed no later than:","21 days from receipt",["45 days","30 days","7 days"],"As per Table 15.1.");
Q(15,"Under ODR, the conciliation process must be completed within:","21 days, extendable by 10 days with consent of both parties",["30 days, extendable by 30 days","7 days","90 days"],"If unsuccessful, matter may go to arbitration.");
Q(15,"Under ODR, the arbitration process must be concluded within:","30 days, extendable by 30 days with consent of the parties",["21 days, extendable by 10 days","15 days","1 year"],"Conciliation is 21 + 10 days.");
Q(15,"Which is a point to keep in mind while thanking investors?","Greet the investor by name once introduced",["Thank only at the start","Use a fixed script without personalisation","Avoid repeating thanks"],"Also express specific gratitude and repeat thanks.");
Q(15,"An investor is any person or entity who:","Commits capital with the expectation of receiving financial returns",["Only trades in derivatives","Lends money to the RTA","Works for a stock exchange"],"Through equity, debt or mutual fund units.");
Q(15,"Etiquette in investor service is:","Conduct acceptable to investors that meets their expectations",["A legal requirement under PMLA","A SEBI fee","A type of corporate action"],"Being transparent, truthful, professional and grateful.");

<script>
const CH={1:"Introduction to Securities",2:"Characteristics of Equity Shares",3:"Characteristics of Debt Securities",4:"Characteristics of Other Securities",5:"Basics of Mutual Funds",6:"SEBI: Role and Regulations",7:"Public Offer of Securities",8:"Allotment other than Public Offers",9:"Processes: Public Offering of Shares",10:"Roles and Responsibilities in a Public Issue",11:"Depository Services",12:"Processes related to Depositories",13:"Investor Interface with the R&T Agent",14:"Secondary Market Transactions",15:"Client Servicing"};
const W={1:3,2:6,3:6,4:3,5:3,6:14,7:5,8:2,9:8,10:6,11:6,12:16,13:10,14:5,15:7};
const KEY="nism2a-mocks-v2";
try{localStorage.removeItem("nism2a-mocks-v1")}catch(e){}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// Chapter split for n questions: largest remainder on official weightage, ties to heavier chapter
function split(n){
  const raw=Object.keys(W).map(c=>({c,x:W[c]*n/100}));
  raw.forEach(r=>{r.k=Math.floor(r.x);r.f=r.x-r.k});
  let left=n-raw.reduce((s,r)=>s+r.k,0);
  raw.slice().sort((a,b)=>b.f-a.f||W[b.c]-W[a.c]||a.c-b.c).forEach(r=>{if(left>0){r.k++;left--}});
  const o={};raw.forEach(r=>o[r.c]=r.k);return o;
}
const SETS=[
  {key:"Q",label:"Quick Test",plural:"Quick tests",n:30,count:10,mins:36,blurb:"Same length as the NISM website mock. A quick daily check."},
  {key:"H",label:"Half Mock",plural:"Half mocks",n:50,count:15,mins:60,blurb:"Half the real paper in an hour. Builds speed and stamina."},
  {key:"F",label:"Full Mock",plural:"Full mocks",n:100,count:25,mins:120,blurb:"Exact exam format: 100 questions in 2 hours."}
];
SETS.forEach((s,si)=>{
  s.si=si;s.mix=split(s.n);s.pass=Math.ceil(s.n/2);s.time=s.mins*60;
  s.pools={};for(const c in W){const ids=BANK.filter(b=>b.ch==c).map(b=>b.id);s.pools[c]=shuffle(ids,rng(s.key==="F"?1000+ +c:1000*(si+2)+ +c))}
});
const SET=k=>SETS.find(s=>s.key===k);
const PIN=/^(All the options given|All of the above|None of the above)$/;
function buildMock(sk,m){
  const s=SET(sk),F=sk==="F";let ids=[];
  for(const c in W){const p=s.pools[c],k=s.mix[c],n=p.length,st=(m*k)%n;for(let i=0;i<k;i++)ids.push(p[(st+i)%n])}
  shuffle(ids,rng(F?5000+m:5000+s.si*100+m));
  return ids.map(id=>{
    const b=BANK[id];let opts;
    if(b.a==="True"||b.a==="False"){opts=["True","False"]}
    else{opts=shuffle([b.a,...b.w],rng((F?m:(s.si*1000+m))*7919+id+1));const p=opts.filter(o=>PIN.test(o));opts=opts.filter(o=>!PIN.test(o)).concat(p)}
    return {id,ch:b.ch,q:b.q,opts,correct:opts.indexOf(b.a),e:b.e};
  });
}
// storage (per-viewer convenience only)
let DB={progress:{},results:{}};
function load(){try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);DB={progress:d.progress||{},results:d.results||{}};
}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
load();save();

const app=document.getElementById('app');
let S=null,tickH=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const fmt=s=>{s=Math.max(0,Math.floor(s));return pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60)};
const L="ABCD";
const id=(sk,m)=>sk+m;
const title=(sk,m)=>SET(sk).label+" "+pad(m+1);
function stopTick(){if(tickH){clearInterval(tickH);tickH=null}}
const pct=(x,n)=>Math.round(x/n*100);

/* ---------- HOME ---------- */
function home(){
  stopTick();S=null;
  let attempts=0,passedAll=0;const sum={};
  let sections="";
  SETS.forEach(s=>{
    let done=0,passed=0,tot=0,best=null,cards="";
    for(let m=0;m<s.count;m++){
      const r=DB.results[id(s.key,m)]||[],p=DB.progress[id(s.key,m)];
      const b=r.length?Math.max(...r.map(x=>x.score)):null;
      if(r.length){done++;tot+=pct(r[r.length-1].score,s.n);best=Math.max(best||0,pct(b,s.n));if(b>=s.pass)passed++}
      let pill='<span class="pill">Not started</span>';
      if(p)pill='<span class="pill prog">In progress</span>';
      else if(b!==null)pill='<span class="pill '+(b>=s.pass?"pass":"fail")+'">Best '+b+'/'+s.n+'</span>';
      const meta=p?(p.answers.filter(x=>x!==null).length+"/"+s.n+" answered"):(r.length?r.length+" attempt"+(r.length>1?"s":"")+" · last "+r[r.length-1].score+"/"+s.n:s.n+" questions · "+s.mins+" min");
      cards+='<button class="card" data-s="'+s.key+'" data-m="'+m+'"><div class="top"><span class="num">'+pad(m+1)+'</span>'+pill+'</div><div class="meter"><i style="width:'+(b!==null?pct(b,s.n):0)+'%"></i><span class="pm"></span></div><div class="meta">'+meta+'</div></button>';
    }
    attempts+=done;passedAll+=passed;
    sections+='<section class="set" id="set-'+s.key+'"><div class="sethead"><div><h2>'+s.plural+'</h2><p class="muted">'+s.blurb+'</p></div>'+
    '<div class="setfacts mono"><span><b>'+s.count+'</b> mocks</span><span><b>'+s.n+'</b> Q</span><span><b>'+s.mins+'</b> min</span><span><b>'+s.pass+'</b> to pass</span><span><b>'+done+'/'+s.count+'</b> done</span><span><b>'+(done?Math.round(tot/done)+"%":"--")+'</b> avg</span></div></div>'+
    '<div class="grid">'+cards+'</div></section>';
  });
  app.innerHTML='<div class="wrap">'+
  '<div class="masthead"><div><div class="eyebrow">Registrars to an Issue and Share Transfer Agents · Corporate</div><h1>NISM Series II-A<br>Mock Exams</h1><p>50 mocks in three lengths, built on the August 2026 workbook. Every mock follows the official chapter weightage, so depositories, SEBI regulations and investor services carry the most questions, as in the real exam.</p></div>'+
  '<div class="facts"><div><b>100</b><span>Q in real exam</span></div><div><b>120</b><span>minutes</span></div><div><b>50%</b><span>to pass</span></div><div><b>0</b><span>negative marks</span></div></div></div>'+
  '<nav class="jump">'+SETS.map(s=>'<a href="#set-'+s.key+'"><b>'+s.count+' x '+s.n+'</b> '+s.plural+'</a>').join("")+'<span class="muted">'+attempts+'/50 attempted · '+passedAll+' passed</span><button class="btn ghost" id="resetall" style="font-size:13px;padding:6px 12px">Reset all tests</button></nav>'+
  sections+
  '<p class="note">Questions come from a bank of '+BANK.length+' questions written from the workbook text and its sample questions. Within a set, each mock is a different mix and no question repeats inside a mock. Across the 50 mocks a question appears about 5 times, with question and option order changed. Time limits use the real exam pace of 1.2 minutes per question. The gold line on each bar marks the 50% pass mark. Progress and scores are saved only in this browser on this device.</p>'+
  '</div>';
  app.querySelectorAll('.card').forEach(b=>b.onclick=()=>intro(b.dataset.s,+b.dataset.m));
  document.getElementById('resetall').onclick=()=>{
    const ov=document.createElement('div');ov.className="overlay";
    ov.innerHTML='<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="rh"><h3 id="rh">Reset all tests?</h3><p>This deletes scores, attempt history and in-progress answers for all 50 mocks in this browser. It cannot be undone.</p><div class="row" style="margin-top:16px"><button class="btn" id="rk">Cancel</button><button class="btn primary" id="rg">Reset everything</button></div></div>';
    document.body.appendChild(ov);
    ov.querySelector('#rk').onclick=()=>ov.remove();
    ov.onclick=e=>{if(e.target===ov)ov.remove()};
    ov.querySelector('#rg').onclick=()=>{DB={progress:{},results:{}};save();ov.remove();home()};
  };
  app.querySelectorAll('.jump a').forEach(a=>a.onclick=e=>{e.preventDefault();const t=document.querySelector(a.getAttribute('href'));if(t)t.scrollIntoView({behavior:"smooth"})});
}

/* ---------- INTRO ---------- */
function intro(sk,m,mode){
  mode=mode||"exam";const s=SET(sk),k=id(sk,m);
  const p=DB.progress[k],r=DB.results[k]||[];
  let mix="";for(const c in W)if(s.mix[c])mix+='<tr><td>Ch '+c+': '+esc(CH[c])+'</td><td>'+s.mix[c]+'</td></tr>';
  let hist="";if(r.length){hist='<div class="history"><b>Previous attempts</b><ul>'+r.slice(-5).reverse().map(x=>'<li class="mono">'+x.date+' · '+x.mode+' · '+x.score+'/'+s.n+' · '+fmt(x.used)+'</li>').join("")+'</ul><button class="btn ghost" id="lastrev">Review last attempt</button></div>'}
  app.innerHTML='<div class="wrap"><button class="btn ghost" id="back">&larr; All mocks</button><div class="intro">'+
  '<div class="eyebrow">'+s.n+' questions · '+s.mins+' minutes · pass '+s.pass+'</div><h2>'+title(sk,m)+'</h2>'+
  (p?'<p>You have this mock in progress: <b class="mono">'+p.answers.filter(x=>x!==null).length+'/'+s.n+'</b> answered'+(p.mode==="exam"?', <b class="mono">'+fmt(p.remaining)+'</b> left':'')+'.</p><div class="row"><button class="btn primary" id="resume">Resume</button><button class="btn" id="discard">Discard and start over</button></div>':
  '<div class="modes"><button class="mode" data-mode="exam" aria-pressed="'+(mode==="exam")+'"><b>Exam mode</b><span>'+s.mins+'-minute timer, answers revealed only after you submit.</span></button><button class="mode" data-mode="practice" aria-pressed="'+(mode==="practice")+'"><b>Practice mode</b><span>No timer. See the correct answer and explanation right after each question.</span></button></div><div class="row"><button class="btn primary" id="start">Start '+title(sk,m)+'</button><span class="muted" style="font-size:13px">Answer every question: there is no negative marking.</span></div>')+
  hist+
  '<details style="margin-top:18px"><summary class="muted" style="cursor:pointer">Questions per chapter in this set</summary><table class="mixtable">'+mix+'</table></details>'+
  '</div></div>';
  document.getElementById('back').onclick=()=>{home();const t=document.getElementById('set-'+sk);if(t)t.scrollIntoView()};
  app.querySelectorAll('.mode').forEach(b=>b.onclick=()=>intro(sk,m,b.dataset.mode));
  const st=document.getElementById('start');if(st)st.onclick=()=>start(sk,m,mode);
  const rs=document.getElementById('resume');if(rs)rs.onclick=()=>resume(sk,m);
  const dc=document.getElementById('discard');if(dc)dc.onclick=()=>{delete DB.progress[k];save();intro(sk,m)};
  const lr=document.getElementById('lastrev');if(lr)lr.onclick=()=>{const x=r[r.length-1];S={sk,m,mode:x.mode==="Exam"?"exam":"practice",qs:buildMock(sk,m),answers:x.answers,marked:[],cur:0,remaining:s.time-x.used,used:x.used};result(true)};
  window.scrollTo(0,0);
}

/* ---------- EXAM ---------- */
function start(sk,m,mode){const s=SET(sk);S={sk,m,mode,qs:buildMock(sk,m),answers:Array(s.n).fill(null),marked:[],cur:0,remaining:s.time,used:0};persist();exam()}
function resume(sk,m){const p=DB.progress[id(sk,m)];S={sk,m,mode:p.mode,qs:buildMock(sk,m),answers:p.answers,marked:p.marked||[],cur:p.cur||0,remaining:p.remaining,used:p.used||0};exam()}
function persist(){if(!S)return;DB.progress[id(S.sk,S.m)]={mode:S.mode,answers:S.answers,marked:S.marked,cur:S.cur,remaining:S.remaining,used:S.used};save()}
const N=()=>S.qs.length;

function exam(){
  app.innerHTML='<div class="bar"><div class="in"><span class="title">'+title(S.sk,S.m)+'</span><span class="chip">'+(S.mode==="exam"?"Exam mode":"Practice mode")+'</span><span class="spacer"></span>'+
  (S.mode==="exam"?'<span class="timer" id="timer" aria-label="Time remaining">'+fmt(S.remaining)+'</span>':'')+
  '<button class="btn" id="save">Save<span class="lg"> and exit</span></button><button class="btn primary" id="submit">Submit</button></div></div>'+
  '<div class="wrap" style="padding-top:0"><div class="exam"><div class="qcard" id="qcard"></div><aside class="sheet"><h3>Answer sheet</h3><div class="bubbles" id="bubbles"></div>'+
  '<div class="legend"><span><i></i>Not answered</span><span><i class="a"></i>Answered</span><span><i class="m"></i>Marked for review</span></div>'+
  '<div class="counts"><div><b id="cA">0</b><span>answered</span></div><div><b id="cM">0</b><span>marked</span></div><div><b id="cL">'+N()+'</b><span>left</span></div></div></aside></div></div>';
  let bh="";for(let i=0;i<N();i++)bh+='<button data-i="'+i+'" aria-label="Question '+(i+1)+'">'+(i+1)+'</button>';
  document.getElementById('bubbles').innerHTML=bh;
  document.getElementById('bubbles').onclick=e=>{const b=e.target.closest('button');if(b){S.cur=+b.dataset.i;renderQ(true)}};
  document.getElementById('save').onclick=()=>{persist();home()};
  document.getElementById('submit').onclick=confirmSubmit;
  renderQ(false);stopTick();
  tickH=setInterval(()=>{
    if(!S)return;S.used++;
    if(S.mode==="exam"){S.remaining--;const t=document.getElementById('timer');if(t){t.textContent=fmt(S.remaining);t.classList.toggle('low',S.remaining<=Math.min(600,SET(S.sk).time/6))}if(S.remaining<=0){stopTick();submit(true);return}}
    if(S.used%5===0)persist();
  },1000);
  window.scrollTo(0,0);
}
function renderQ(scroll){
  const q=S.qs[S.cur],a=S.answers[S.cur],prac=S.mode==="practice",locked=prac&&a!==null,last=S.cur===N()-1;
  let o="";
  q.opts.forEach((t,i)=>{
    let cls="opt";
    if(locked){if(i===q.correct)cls+=" right";else if(i===a)cls+=" wrong"}else if(i===a)cls+=" sel";
    o+='<button class="'+cls+'" data-o="'+i+'"'+(locked?' disabled':'')+'><span class="bub">'+L[i]+'</span><span>'+esc(t)+'</span></button>';
  });
  const mk=S.marked.includes(S.cur);
  document.getElementById('qcard').innerHTML='<div class="qhead"><span class="qno">Question '+(S.cur+1)+' of '+N()+'</span><span class="chip">Ch '+q.ch+' · '+esc(CH[q.ch])+'</span></div>'+
  '<div class="qtext">'+esc(q.q)+'</div><div class="opts">'+o+'</div>'+
  (locked?'<div class="explain"><b>'+(a===q.correct?"Correct.":"Not quite. Answer: "+L[q.correct]+". "+esc(q.opts[q.correct])+".")+'</b> '+esc(q.e)+'</div>':'')+
  '<div class="qnav"><button class="btn" id="prev"'+(S.cur===0?' disabled':'')+'>&larr; Previous</button><button class="btn ghost" id="mark">'+(mk?"Unmark review":"Mark for review")+'</button>'+(!prac?'<button class="btn ghost" id="clear"'+(a===null?' disabled':'')+'>Clear answer</button>':'')+'<span class="spacer"></span><button class="btn primary" id="next">'+(last?"Finish":"Next &rarr;")+'</button></div>';
  document.querySelectorAll('#qcard .opt').forEach(b=>b.onclick=()=>{if(b.disabled)return;S.answers[S.cur]=+b.dataset.o;persist();renderQ(false)});
  document.getElementById('prev').onclick=()=>{if(S.cur>0){S.cur--;renderQ(true)}};
  document.getElementById('next').onclick=()=>{if(!last){S.cur++;renderQ(true)}else confirmSubmit()};
  document.getElementById('mark').onclick=()=>{const k=S.marked.indexOf(S.cur);if(k>=0)S.marked.splice(k,1);else S.marked.push(S.cur);persist();renderQ(false)};
  const cl=document.getElementById('clear');if(cl)cl.onclick=()=>{S.answers[S.cur]=null;persist();renderQ(false)};
  paintSheet();
  if(scroll){const c=document.getElementById('qcard');const y=c.getBoundingClientRect().top+window.scrollY-80;if(window.scrollY>y)window.scrollTo(0,Math.max(0,y))}
}
function paintSheet(){
  const prac=S.mode==="practice";let A=0;
  document.querySelectorAll('#bubbles button').forEach((b,i)=>{
    const a=S.answers[i];b.className="";
    if(a!==null){A++;if(prac)b.classList.add(a===S.qs[i].correct?"ok":"no");else b.classList.add("ans")}
    if(S.marked.includes(i))b.classList.add("mk");
    if(i===S.cur)b.classList.add("cur");
  });
  document.getElementById('cA').textContent=A;document.getElementById('cM').textContent=S.marked.length;document.getElementById('cL').textContent=N()-A;
}
function confirmSubmit(){
  const un=S.answers.filter(x=>x===null).length;
  const ov=document.createElement('div');ov.className="overlay";
  ov.innerHTML='<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dh"><h3 id="dh">Submit '+title(S.sk,S.m)+'?</h3><p>'+(un?'<b class="mono">'+un+'</b> question'+(un>1?'s are':' is')+' unanswered. There is no negative marking, so a guess cannot cost you marks.':'All '+N()+' questions are answered.')+(S.marked.length?' <b class="mono">'+S.marked.length+'</b> marked for review.':'')+'</p><div class="row" style="margin-top:16px"><button class="btn" id="keep">Keep working</button><button class="btn primary" id="go">Submit now</button></div></div>';
  document.body.appendChild(ov);
  ov.querySelector('#keep').onclick=()=>ov.remove();
  ov.querySelector('#go').onclick=()=>{ov.remove();submit(false)};
  ov.onclick=e=>{if(e.target===ov)ov.remove()};
  ov.querySelector('#go').focus();
}
function submit(auto){
  stopTick();
  const score=S.qs.reduce((s,q,i)=>s+(S.answers[i]===q.correct?1:0),0);
  const d=new Date();const date=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
  const k=id(S.sk,S.m);(DB.results[k]=DB.results[k]||[]).push({score,date,used:S.used,mode:S.mode==="exam"?"Exam":"Practice",answers:S.answers.slice(),auto:!!auto});
  delete DB.progress[k];save();
  result(false,auto);
}

/* ---------- RESULT ---------- */
function result(isReview,auto){
  stopTick();
  const s=SET(S.sk),qs=S.qs,ans=S.answers,n=N();
  let ok=0,no=0,sk=0;const per={};for(const c in W)per[c]={n:0,ok:0};
  qs.forEach((q,i)=>{per[q.ch].n++;if(ans[i]===null)sk++;else if(ans[i]===q.correct){ok++;per[q.ch].ok++}else no++});
  const pass=ok>=s.pass;
  let rows="";Object.keys(W).sort((a,b)=>W[b]-W[a]||a-b).forEach(c=>{const p=per[c];if(!p.n)return;const pc=pct(p.ok,p.n);const col=pc>=70?"var(--good)":pc>=50?"var(--gold)":"var(--bad)";rows+='<tr><td>Ch '+c+': '+esc(CH[c])+'</td><td class="n">'+p.ok+'/'+p.n+'</td><td class="n">'+pc+'%</td><td style="width:30%"><div class="hbar"><i style="width:'+pc+'%;background:'+col+'"></i></div></td></tr>'});
  const hasNext=S.m<s.count-1;
  app.innerHTML='<div class="wrap"><div class="row"><button class="btn ghost" id="back">&larr; All mocks</button><span style="flex:1"></span><button class="btn" id="again">Retake</button>'+(hasNext?'<button class="btn primary" id="nextm">'+title(S.sk,S.m+1)+' &rarr;</button>':'')+'</div>'+
  '<div class="result-head"><div><div class="score">'+ok+'<small>/'+n+'</small></div><div class="muted mono" style="margin-top:6px">'+pct(ok,n)+'%</div></div><div><span class="verdict '+(pass?"pass":"fail")+'">'+(pass?"PASS":"BELOW PASS MARK")+'</span>'+(auto?' <span class="muted" style="font-size:13px">Time ran out; submitted automatically.</span>':'')+'<h2 style="font-size:24px;margin-top:8px">'+title(S.sk,S.m)+(isReview?' · last attempt':'')+'</h2>'+
  '<div class="rstats"><div><b style="color:var(--good)">'+ok+'</b><span>correct</span></div><div><b style="color:var(--bad)">'+no+'</b><span>wrong</span></div><div><b>'+sk+'</b><span>unanswered</span></div><div><b>'+fmt(S.used)+'</b><span>time used</span></div><div><b>'+(pass?"+"+(ok-s.pass):(s.pass-ok))+'</b><span>'+(pass?"marks above pass":"marks short of pass")+'</span></div></div></div></div>'+
  '<div class="tablewrap"><table class="ch"><thead><tr><th>Chapter (by weightage)</th><th style="text-align:right">Score</th><th style="text-align:right">%</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
  '<div class="filters" id="filters"><button class="btn" data-f="no" aria-pressed="true">Wrong ('+no+')</button><button class="btn" data-f="skip" aria-pressed="false">Unanswered ('+sk+')</button><button class="btn" data-f="ok" aria-pressed="false">Correct ('+ok+')</button><button class="btn" data-f="all" aria-pressed="false">All '+n+'</button></div><div id="rvlist"></div></div>';
  document.getElementById('back').onclick=()=>{const k=S.sk;home();const t=document.getElementById('set-'+k);if(t)t.scrollIntoView()};
  document.getElementById('again').onclick=()=>intro(S.sk,S.m);
  const nm=document.getElementById('nextm');if(nm)nm.onclick=()=>intro(S.sk,S.m+1);
  const draw=f=>{
    let h="";qs.forEach((q,i)=>{const a=ans[i];const st=a===null?"skip":a===q.correct?"ok":"no";if(f!=="all"&&f!==st)return;
      h+='<div class="rv '+st+'"><div class="row" style="justify-content:space-between"><span class="qno">Q'+(i+1)+'</span><span class="chip">Ch '+q.ch+'</span></div><div class="q">'+esc(q.q)+'</div><div class="ans">'+
      (st==="ok"?'<span class="c">Your answer: '+L[a]+'. '+esc(q.opts[a])+'</span>':(a===null?'<span class="muted">Not answered</span>':'<span class="y bad">Your answer: '+L[a]+'. '+esc(q.opts[a])+'</span>')+'<span class="c">Correct: '+L[q.correct]+'. '+esc(q.opts[q.correct])+'</span>')+
      '</div><div class="e">'+esc(q.e)+'</div></div>'});
    document.getElementById('rvlist').innerHTML=h||'<p class="muted">Nothing in this list.</p>';
  };
  document.getElementById('filters').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw(b.dataset.f)};
  const f0=no?"no":"all";document.querySelectorAll('#filters button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.f===f0));draw(f0);
  window.scrollTo(0,0);
}
document.addEventListener('keydown',e=>{
  if(!S||!document.getElementById('qcard')||document.querySelector('.overlay'))return;
  const k=e.key.toLowerCase();
  if(["a","b","c","d"].includes(k)){const b=document.querySelector('#qcard .opt[data-o="'+"abcd".indexOf(k)+'"]');if(b&&!b.disabled)b.click()}
  else if(e.key==="ArrowRight"){document.getElementById('next').click()}
  else if(e.key==="ArrowLeft"){const p=document.getElementById('prev');if(!p.disabled)p.click()}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});
home();
</script>
